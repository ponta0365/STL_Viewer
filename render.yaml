services:
  - type: web
    name: stl-viewer
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn server_app:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: STORAGE_DIR
        value: /opt/render/project/src/data
    disk:
      name: stl-viewer-data
      mountPath: /opt/render/project/src/data
      sizeGB: 1
